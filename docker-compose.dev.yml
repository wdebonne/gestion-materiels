version: '3.8'

services:
  # Application en mode développement
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gestion-materiels-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev_secret_jwt_not_for_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_not_for_production}
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/database.sqlite
      # Configuration SMTP (optionnel)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      # Montage du code source pour le hot-reload
      - ./src:/app/src
      - ./client:/app/client
      - ./plugins:/app/plugins
      # Données persistantes
      - app-data-dev:/app/data
      - app-uploads-dev:/app/uploads
      - app-backups-dev:/app/backups
      - app-logs-dev:/app/logs
    networks:
      - gestion-network-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  app-data-dev:
    name: gestion-materiels-data-dev
  app-uploads-dev:
    name: gestion-materiels-uploads-dev
  app-backups-dev:
    name: gestion-materiels-backups-dev
  app-logs-dev:
    name: gestion-materiels-logs-dev

networks:
  gestion-network-dev:
    name: gestion-materiels-network-dev
    driver: bridge
