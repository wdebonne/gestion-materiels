version: '3.8'

services:
  # Application principale (SQLite uniquement)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-materiels-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-votre_secret_jwt_tres_long_et_securise}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-votre_refresh_secret_tres_long}
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/database.sqlite
      # Configuration SMTP (optionnel)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
      - app-backups:/app/backups
      - app-logs:/app/logs
    networks:
      - gestion-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  app-data:
    name: gestion-materiels-data
  app-uploads:
    name: gestion-materiels-uploads
  app-backups:
    name: gestion-materiels-backups
  app-logs:
    name: gestion-materiels-logs

networks:
  gestion-network:
    name: gestion-materiels-network
    driver: bridge
