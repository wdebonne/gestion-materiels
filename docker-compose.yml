version: '3.8'

services:
  # Application principale
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-materiels-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-votre_secret_jwt_tres_long_et_securise}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-votre_refresh_secret_tres_long}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - SQLITE_PATH=/app/data/database.sqlite
      # Configuration MySQL (si DB_TYPE=mysql)
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-gestion}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-gestion_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-gestion_materiels}
      # Configuration SMTP
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
      - app-backups:/app/backups
      - app-logs:/app/logs
    networks:
      - gestion-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Base de données MySQL (optionnel - commentez si vous utilisez SQLite)
  mysql:
    image: mysql:8.0
    container_name: gestion-materiels-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-gestion_materiels}
      - MYSQL_USER=${MYSQL_USER:-gestion}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-gestion_password}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gestion-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Reverse proxy Nginx (optionnel - pour production avec SSL)
  nginx:
    image: nginx:alpine
    container_name: gestion-materiels-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - gestion-network
    depends_on:
      - app
    profiles:
      - production

volumes:
  app-data:
    name: gestion-materiels-data
  app-uploads:
    name: gestion-materiels-uploads
  app-backups:
    name: gestion-materiels-backups
  app-logs:
    name: gestion-materiels-logs
  mysql-data:
    name: gestion-materiels-mysql

networks:
  gestion-network:
    name: gestion-materiels-network
    driver: bridge
